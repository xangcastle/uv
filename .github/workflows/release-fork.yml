name: Release Fork

# Trigger: runs on every push to the bazel-integration branch AND on manual dispatch
on:
  push:
    branches:
      - xancastle/bazel-integration
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., 0.11.6-bazel.1). Leave empty to auto-generate from commit.'
        required: false
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  # ---------------------------------------------------------------------------
  # Generate a unique version/tag for this build
  # ---------------------------------------------------------------------------
  version:
    name: Generate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate version
        id: version
        shell: bash
        run: |
          # Base version from Cargo.toml
          BASE_VERSION=$(grep '^version = ' crates/uv/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')

          if [[ -n "${{ inputs.tag }}" ]]; then
            # Manual dispatch with explicit tag
            TAG="${{ inputs.tag }}"
            VERSION="${TAG#v}"
          else
            # Auto-generate: base version + short sha + timestamp
            SHORT_SHA=$(git rev-parse --short HEAD)
            TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
            VERSION="${BASE_VERSION}+bazel.${TIMESTAMP}.${SHORT_SHA}"
            TAG="v${VERSION}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"
          echo "Tag: ${TAG}"

  # ---------------------------------------------------------------------------
  # Build the Bazel shim for each target platform
  # ---------------------------------------------------------------------------
  build-shims:
    name: Build Bazel shims
    runs-on: ${{ matrix.os }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64 - native build
          - target: aarch64-apple-darwin
            os: macos-latest
            shim_name: uv-bazel-shim-aarch64-apple-darwin

          # macOS x86_64 - cross compile from ARM64
          - target: x86_64-apple-darwin
            os: macos-latest
            shim_name: uv-bazel-shim-x86_64-apple-darwin

          # Linux x86_64 - uses cargo-zigbuild for static linking
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            shim_name: uv-bazel-shim-x86_64-unknown-linux-gnu
            use_zigbuild: true

          # Linux ARM64 - uses cargo-zigbuild for cross compilation
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            shim_name: uv-bazel-shim-aarch64-unknown-linux-gnu
            use_zigbuild: true

          # Windows x86_64 - cross compile from Linux
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            shim_name: uv-bazel-shim-x86_64-pc-windows-gnu.exe
            use_zigbuild: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5ce83dd
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild (Linux cross builds)
        if: matrix.use_zigbuild
        run: |
          cargo install cargo-zigbuild --locked

      - name: Build shim (native macOS)
        if: ${{ !matrix.use_zigbuild }}
        working-directory: crates/uv-bazel-shim
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Build shim (zigbuild cross)
        if: matrix.use_zigbuild
        working-directory: crates/uv-bazel-shim
        run: |
          cargo zigbuild --release --target ${{ matrix.target }}

      - name: Upload shim artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: shim-${{ matrix.target }}
          path: crates/uv-bazel-shim/target/${{ matrix.target }}/release/uv-bazel-shim${{ endsWith(matrix.shim_name, '.exe') && '.exe' || '' }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build the main uv binary for each platform (with embedded shims)
  # ---------------------------------------------------------------------------
  build-uv:
    name: Build uv ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [version, build-shims]
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64
          - target: aarch64-apple-darwin
            os: macos-latest
            arch: aarch64

          # macOS x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            arch: x86_64

          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            arch: x86_64
            use_zigbuild: true

          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            arch: aarch64
            use_zigbuild: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild (Linux)
        if: matrix.use_zigbuild
        run: |
          cargo install cargo-zigbuild --locked

      # Download ALL shim artifacts
      - name: Download all shims
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: downloaded-shims
          pattern: shim-*

      - name: Stage shims for embedding
        run: |
          mkdir -p crates/uv/src/commands/venv/shims

          # Copy each shim with the correct naming convention
          for shim_dir in downloaded-shims/shim-*/; do
            # Find the actual binary inside
            shim_bin=$(find "$shim_dir" -type f -name 'uv-bazel-shim*' | head -1)
            if [[ -n "$shim_bin" ]]; then
              # Extract target from directory name
              target=$(basename "$shim_dir" | sed 's/shim-//')

              # Determine the correct filename
              if [[ "$shim_bin" == *.exe ]]; then
                dest_name="uv-bazel-shim-${target}.exe"
              else
                dest_name="uv-bazel-shim-${target}"
              fi

              cp "$shim_bin" "crates/uv/src/commands/venv/shims/${dest_name}"
              echo "Staged: ${dest_name} ($(stat -f%z "$shim_bin" 2>/dev/null || stat -c%s "$shim_bin")) bytes"
            fi
          done

          ls -la crates/uv/src/commands/venv/shims/

      - name: Build uv (native macOS)
        if: ${{ !matrix.use_zigbuild }}
        run: |
          cargo build --release --target ${{ matrix.target }} -p uv

      - name: Build uv (zigbuild Linux)
        if: matrix.use_zigbuild
        run: |
          cargo zigbuild --release --target ${{ matrix.target }} -p uv

      - name: Archive binary
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_NAME="uv-${VERSION}-${TARGET}"
          ARCHIVE_FILE="${ARCHIVE_NAME}.tar.gz"

          mkdir -p "$ARCHIVE_NAME"

          # Copy the main binary
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            cp "target/${TARGET}/release/uv" "$ARCHIVE_NAME/uv"
            cp "target/${TARGET}/release/uvx" "$ARCHIVE_NAME/uvx" 2>/dev/null || true
          else
            cp "target/${TARGET}/release/uv" "$ARCHIVE_NAME/uv"
            cp "target/${TARGET}/release/uvx" "$ARCHIVE_NAME/uvx" 2>/dev/null || true
          fi

          # Create archive
          tar czvf "$ARCHIVE_FILE" "$ARCHIVE_NAME"

          # Generate checksum
          sha256sum "$ARCHIVE_FILE" > "${ARCHIVE_FILE}.sha256"

          echo "Created: $ARCHIVE_FILE"
          ls -la "$ARCHIVE_FILE"

      - name: Upload binary artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: uv-${{ matrix.target }}
          path: |
            uv-*.tar.gz
            uv-*.tar.gz.sha256

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all artifacts
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [version, build-uv]
    if: always() && needs.build-uv.result == 'success'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
          pattern: uv-*

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          find artifacts -name '*.sha256' -exec cp {} release/ \;
          ls -la release/

      - name: Generate release notes
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          TAG="${{ needs.version.outputs.tag }}"
          SHA="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"

          cat > release-notes.md << EOF
          # uv ${VERSION} (Bazel Integration Fork)

          **Branch:** \`${BRANCH}\`
          **Commit:** \`${SHA}\`
          **Auto-generated:** $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)

          This is an automated release from the \`xancastle/bazel-integration\` branch containing Bazel runfiles integration for \`uv venv\`.

          ## Changes in this build

          - Includes \`uv venv --mode=bazel-runfiles\` support
          - Embeds cross-platform Bazel shim binaries
          - Supports PTH manifest-based venv population

          ## Binaries

          | Platform | Archive |
          |----------|---------|
          | macOS ARM64 | \`uv-${VERSION}-aarch64-apple-darwin.tar.gz\` |
          | macOS x86_64 | \`uv-${VERSION}-x86_64-apple-darwin.tar.gz\` |
          | Linux x86_64 | \`uv-${VERSION}-x86_64-unknown-linux-gnu.tar.gz\` |
          | Linux ARM64 | \`uv-${VERSION}-aarch64-unknown-linux-gnu.tar.gz\` |

          ## Installation

          \`\`\`bash
          # Download and extract
curl -L -o uv.tar.gz "https://github.com/${{ github.repository }}/releases/download/${TAG}/uv-${VERSION}-YOUR_TARGET.tar.gz"
          tar xzf uv.tar.gz

          # The binary includes embedded Bazel shims for all supported platforms
          ./uv-${VERSION}-YOUR_TARGET/uv --help
          \`\`\`

          ## Verification

          SHA-256 checksums are provided in the \`.sha256\` files.
          EOF

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "uv ${{ needs.version.outputs.version }} (bazel-fork)"
          body_path: release-notes.md
          draft: ${{ inputs.draft != false }}
          prerelease: true
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output release URL
        run: |
          echo ""
          echo "============================================================"
          echo "  Release created: ${{ needs.version.outputs.tag }}"
          echo "  URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.tag }}"
          echo "============================================================"
