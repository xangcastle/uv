name: CI

on:
  push:
    branches: [xancastle/bazel-integration]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  # ---------------------------------------------------------------------------
  # Generate a unique version/tag for this build
  # ---------------------------------------------------------------------------
  version:
    name: Generate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate version
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(grep '^version = ' crates/uv/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          VERSION="${BASE_VERSION}+bazel.${TIMESTAMP}.${SHORT_SHA}"
          TAG="v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"
          echo "Tag: ${TAG}"

  # ---------------------------------------------------------------------------
  # Build the Bazel shim for each target platform
  # ---------------------------------------------------------------------------
  build-shims:
    name: Build Bazel shims
    runs-on: ${{ matrix.os }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            shim_name: uv-bazel-shim-aarch64-apple-darwin

          - target: x86_64-apple-darwin
            os: macos-latest
            shim_name: uv-bazel-shim-x86_64-apple-darwin

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            shim_name: uv-bazel-shim-x86_64-unknown-linux-gnu

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            shim_name: uv-bazel-shim-aarch64-unknown-linux-gnu
            use_cross: true

          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            shim_name: uv-bazel-shim-x86_64-pc-windows-gnu.exe
            use_zigbuild: true

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup update 1.94.1
          rustup default 1.94.1
          rustup target add ${{ matrix.target }}

      - name: Install cross-compilation toolchain (aarch64 Linux)
        if: matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Install Zig
        if: matrix.target == 'x86_64-pc-windows-gnu'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - name: Install cargo-zigbuild
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: cargo install cargo-zigbuild --locked

      - name: Build shim (native)
        if: ${{ !matrix.use_cross && matrix.target != 'x86_64-pc-windows-gnu' }}
        working-directory: crates/uv-bazel-shim
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build shim (cross aarch64 Linux)
        if: matrix.use_cross
        working-directory: crates/uv-bazel-shim
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build shim (zigbuild Windows)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        working-directory: crates/uv-bazel-shim
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Upload shim artifact
        uses: actions/upload-artifact@v4
        with:
          name: shim-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/uv-bazel-shim${{ endsWith(matrix.shim_name, '.exe') && '.exe' || '' }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build the main uv binary for each platform (with embedded shims)
  # ---------------------------------------------------------------------------
  build-uv:
    name: Build uv ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [version, build-shims]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest

          - target: x86_64-apple-darwin
            os: macos-latest

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true

          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup update 1.94.1
          rustup default 1.94.1
          rustup target add ${{ matrix.target }}

      - name: Install cross-compilation toolchain (aarch64 Linux)
        if: matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Download all shims
        uses: actions/download-artifact@v4
        with:
          path: downloaded-shims
          pattern: shim-*

      - name: Stage shims for embedding
        shell: bash
        run: |
          mkdir -p crates/uv/src/commands/venv/shims
          for shim_dir in downloaded-shims/shim-*/; do
            shim_bin=$(find "$shim_dir" -type f -name 'uv-bazel-shim*' | head -1)
            if [[ -n "$shim_bin" ]]; then
              target=$(basename "$shim_dir" | sed 's/shim-//')
              if [[ "$shim_bin" == *.exe ]]; then
                dest_name="uv-bazel-shim-${target}.exe"
              else
                dest_name="uv-bazel-shim-${target}"
              fi
              cp "$shim_bin" "crates/uv/src/commands/venv/shims/${dest_name}"
              echo "Staged: ${dest_name} ($(stat -f%z "$shim_bin" 2>/dev/null || stat -c%s "$shim_bin" 2>/dev/null || wc -c < "$shim_bin")) bytes"
            fi
          done
          ls -la crates/uv/src/commands/venv/shims/

      - name: Build uv (native)
        if: ${{ !matrix.use_cross && matrix.os != 'windows-latest' }}
        run: cargo build --release --target ${{ matrix.target }} -p uv

      - name: Build uv (cross aarch64 Linux)
        if: matrix.use_cross
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} -p uv

      - name: Build uv (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --release --target ${{ matrix.target }} -p uv

      - name: Archive binary (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_NAME="uv-${VERSION}-${TARGET}"
          ARCHIVE_FILE="${ARCHIVE_NAME}.tar.gz"

          mkdir -p "$ARCHIVE_NAME"
          cp "target/${TARGET}/release/uv" "$ARCHIVE_NAME/uv"
          cp "target/${TARGET}/release/uvx" "$ARCHIVE_NAME/uvx" 2>/dev/null || true

          tar czvf "$ARCHIVE_FILE" "$ARCHIVE_NAME"
          sha256sum "$ARCHIVE_FILE" > "${ARCHIVE_FILE}.sha256"

          echo "Created: $ARCHIVE_FILE"
          ls -la "$ARCHIVE_FILE"

      - name: Archive binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.version.outputs.version }}"
          $TARGET = "${{ matrix.target }}"
          $ARCHIVE_NAME = "uv-$VERSION-$TARGET"
          $ARCHIVE_FILE = "$ARCHIVE_NAME.zip"

          New-Item -ItemType Directory -Force -Path $ARCHIVE_NAME
          Copy-Item "target/$TARGET/release/uv.exe" "$ARCHIVE_NAME/uv.exe"
          Copy-Item "target/$TARGET/release/uvx.exe" "$ARCHIVE_NAME/uvx.exe" -ErrorAction SilentlyContinue

          Compress-Archive -Path $ARCHIVE_NAME -DestinationPath $ARCHIVE_FILE
          (Get-FileHash $ARCHIVE_FILE -Algorithm SHA256).Hash | Out-File -Encoding ASCII "$ARCHIVE_FILE.sha256"

          Write-Host "Created: $ARCHIVE_FILE"
          Get-ChildItem $ARCHIVE_FILE

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: uv-${{ matrix.target }}
          path: |
            uv-*.tar.gz
            uv-*.tar.gz.sha256

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all artifacts
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [version, build-uv]
    if: always() && needs.build-uv.result == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: uv-*

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          find artifacts -name '*.zip' -exec cp {} release/ \;
          find artifacts -name '*.sha256' -exec cp {} release/ \;
          ls -la release/

      - name: Generate release notes
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          TAG="${{ needs.version.outputs.tag }}"
          SHA="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"

          cat > release-notes.md << EOF
          # uv ${VERSION} (Bazel Integration Fork)

          **Branch:** \`${BRANCH}\`
          **Commit:** \`${SHA}\`
          **Auto-generated:** $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)

          ## Changes in this build

          - Includes \`uv venv --mode=bazel-runfiles\` support
          - Embeds cross-platform Bazel shim binaries
          - Supports PTH manifest-based venv population

          ## Binaries

          | Platform | Archive |
          |----------|---------|
          | macOS ARM64 | \`uv-${VERSION}-aarch64-apple-darwin.tar.gz\` |
          | macOS x86_64 | \`uv-${VERSION}-x86_64-apple-darwin.tar.gz\` |
          | Linux x86_64 | \`uv-${VERSION}-x86_64-unknown-linux-gnu.tar.gz\` |
          | Linux ARM64 | \`uv-${VERSION}-aarch64-unknown-linux-gnu.tar.gz\` |
          | Windows x86_64 | \`uv-${VERSION}-x86_64-pc-windows-msvc.zip\` |

          ## Verification

          SHA-256 checksums are provided in the \`.sha256\` files.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "uv ${{ needs.version.outputs.version }} (bazel-fork)"
          body_path: release-notes.md
          draft: false
          prerelease: true
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output release URL
        run: |
          echo ""
          echo "============================================================"
          echo "  Release created: ${{ needs.version.outputs.tag }}"
          echo "  URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.tag }}"
          echo "============================================================"
